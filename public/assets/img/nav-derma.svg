<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-hidden="true">
  <!-- Capa de temporada para el fondo «derma». Los objetos riman
       con los motivos que ya tiene la sección y van en los márgenes,
       no detrás del texto. Se apaga sola fuera de la temporada. -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1400" height="900" fill="url(#d)"/></mask>
    <g id="copo" stroke="#5b86c9" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M0-15V15M-13-7.5 13 7.5M-13 7.5 13-7.5"/>
    <path d="M0-15l-4 4M0-15l4 4M0 15l-4-4M0 15l4-4"/>
  </g>
    <g id="estrella"><path d="M0-14 3.9-3.9 14 0 3.9 3.9 0 14-3.9 3.9-14 0-3.9-3.9z" fill="#c9a24a"/></g>
    <g id="gorro">
    <path d="M-16 10C-16-6-9-17 0-17S16-6 16 10z" fill="#b8434f"/>
    <path d="M0-17c4-6 10-8 14-6-1 5-5 8-9 9" fill="#b8434f"/>
    <circle cx="15" cy="-24" r="5" fill="#f7f6f2"/>
    <rect x="-19" y="8" width="38" height="8" rx="4" fill="#f7f6f2"/>
  </g>
  </defs>
  <g mask="url(#m)" opacity=".3">
    <use href="#copo" transform="translate(130 180) scale(1.5)"/>
    <use href="#copo" transform="translate(1270 260) scale(1.2)"/>
    <use href="#gorro" transform="translate(240 720) scale(1.3)"/>
    <use href="#estrella" transform="translate(1180 160) scale(0.9)"/>
    <use href="#copo" transform="translate(1120 730) scale(1.3)"/>
    <use href="#estrella" transform="translate(320 820) scale(0.7)"/>
  </g>
</svg>
