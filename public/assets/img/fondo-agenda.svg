<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1450" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Quinto fondo decorativo de Alervet, para la agenda de horarios.
       Reloj, libreta con huella, calendario, campana de aviso, lápiz y
       hoja con pendientes: los objetos de quien apunta una cita. -->
  <defs>
    <radialGradient id="a-menta"><stop offset="0" stop-color="#30937b" stop-opacity=".24"/><stop offset="1" stop-color="#30937b" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-agua"><stop offset="0" stop-color="#13779d" stop-opacity=".22"/><stop offset="1" stop-color="#13779d" stop-opacity="0"/></radialGradient>
    <radialGradient id="a-hoja"><stop offset="0" stop-color="#6ea03c" stop-opacity=".20"/><stop offset="1" stop-color="#6ea03c" stop-opacity="0"/></radialGradient>

    <symbol id="reloj-g" viewBox="0 0 240 240">
      <circle cx="120" cy="120" r="112" fill="#ffffff" fill-opacity=".45" stroke="currentColor" stroke-width="6"/>
      <path d="M120.0 24.0L120.0 42.0 M168.0 36.9L162.5 46.4 M203.1 72.0L193.6 77.5 M216.0 120.0L198.0 120.0 M203.1 168.0L193.6 162.5 M168.0 203.1L162.5 193.6 M120.0 216.0L120.0 198.0 M72.0 203.1L77.5 193.6 M36.9 168.0L46.4 162.5 M24.0 120.0L42.0 120.0 M36.9 72.0L46.4 77.5 M72.0 36.9L77.5 46.4" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
      <path d="M120 120V54M120 120l46 30" stroke="currentColor" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="120" cy="120" r="9" fill="currentColor"/>
    </symbol>

    <symbol id="libreta" viewBox="0 0 220 290">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M40 8v30M78 8v30M116 8v30M154 8v30M192 8v30"/>
      </g>
      <rect x="10" y="32" width="200" height="250" rx="12" fill="#ffffff" fill-opacity=".5" stroke="currentColor" stroke-width="4"/>
      <g fill="currentColor" opacity=".55" transform="translate(66 58) scale(.85)">
        <ellipse cx="22" cy="40" rx="9" ry="13" transform="rotate(-22 22 40)"/>
        <ellipse cx="42" cy="26" rx="9" ry="14" transform="rotate(-8 42 26)"/>
        <ellipse cx="63" cy="27" rx="9" ry="14" transform="rotate(10 63 27)"/>
        <ellipse cx="82" cy="43" rx="9" ry="13" transform="rotate(25 82 43)"/>
        <path d="M52 48c16 0 28 11 28 23 0 11-9 18-20 18-4 0-6-1.4-8-1.4s-5 1.4-9 1.4c-10 0-19-7-19-18 0-12 12-23 28-23z"/>
      </g>
      <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
        <rect x="30" y="182" width="24" height="24" rx="5"/><path d="M36 194l5 5 9-11"/><path d="M68 194h112"/>
        <rect x="30" y="222" width="24" height="24" rx="5"/><path d="M36 234l5 5 9-11"/><path d="M68 234h96"/>
      </g>
    </symbol>

    <symbol id="calendario" viewBox="0 0 220 250">
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
        <path d="M46 4v28M92 4v28M138 4v28M184 4v28"/>
      </g>
      <rect x="10" y="26" width="200" height="216" rx="12" fill="#ffffff" fill-opacity=".5" stroke="currentColor" stroke-width="4"/>
      <path d="M10 70h200" stroke="currentColor" stroke-width="4"/>
      <g fill="none" stroke="currentColor" stroke-width="2.6" opacity=".8">
        <rect x="22" y="92" width="28" height="24" rx="4"/>
        <rect x="60" y="92" width="28" height="24" rx="4"/>
        <rect x="98" y="92" width="28" height="24" rx="4"/>
        <rect x="136" y="92" width="28" height="24" rx="4"/>
        <rect x="174" y="92" width="28" height="24" rx="4"/>
        <rect x="22" y="126" width="28" height="24" rx="4"/>
        <rect x="60" y="126" width="28" height="24" rx="4"/>
        <rect x="98" y="126" width="28" height="24" rx="4"/>
        <rect x="136" y="126" width="28" height="24" rx="4"/>
        <rect x="174" y="126" width="28" height="24" rx="4"/>
        <rect x="22" y="160" width="28" height="24" rx="4"/>
        <rect x="60" y="160" width="28" height="24" rx="4"/>
        <rect x="98" y="160" width="28" height="24" rx="4"/>
        <rect x="136" y="160" width="28" height="24" rx="4"/>
        <rect x="174" y="160" width="28" height="24" rx="4"/>
        <rect x="22" y="194" width="28" height="24" rx="4"/>
        <rect x="60" y="194" width="28" height="24" rx="4"/>
        <rect x="98" y="194" width="28" height="24" rx="4"/>
        <rect x="136" y="194" width="28" height="24" rx="4"/>
        <rect x="174" y="194" width="28" height="24" rx="4"/>
      </g>
      <rect x="98" y="126" width="28" height="24" rx="4" fill="currentColor" opacity=".55"/>
    </symbol>

    <symbol id="campana" viewBox="0 0 150 160">
      <path d="M75 18c-24 0-42 18-42 42 0 34-10 44-18 52h120c-8-8-18-18-18-52 0-24-18-42-42-42z"
            fill="#ffffff" fill-opacity=".5" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
      <path d="M75 18V6" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <path d="M60 124a15 15 0 0030 0" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
      <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" opacity=".7">
        <path d="M14 44l-12-6M20 70H6M22 22L12 14M136 44l12-6M130 70h14M128 22l10-8"/>
      </g>
    </symbol>

    <symbol id="lapiz" viewBox="0 0 64 250">
      <path d="M32 6l20 34v168H12V40z" fill="#ffffff" fill-opacity=".5" stroke="currentColor" stroke-width="5" stroke-linejoin="round"/>
      <path d="M12 40h40M12 178h40" stroke="currentColor" stroke-width="5"/>
      <path d="M32 6l20 34H12z" fill="currentColor" opacity=".45"/>
      <rect x="12" y="208" width="40" height="34" rx="8" fill="currentColor" opacity=".35" stroke="currentColor" stroke-width="5"/>
    </symbol>

    <symbol id="papel" viewBox="0 0 250 210">
      <rect x="6" y="6" width="238" height="198" rx="12" fill="#ffffff" fill-opacity=".5" stroke="currentColor" stroke-width="4"/>
      <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round">
        <path d="M34 48l10 10 18-22M78 52h134"/>
        <path d="M34 104l10 10 18-22M78 108h112"/>
        <path d="M34 160l10 10 18-22M78 164h124"/>
      </g>
    </symbol>

    <symbol id="hoja-a" viewBox="0 0 40 80">
      <path d="M20 2C34 20 38 46 38 58c0 14-8 20-18 20S2 72 2 58C2 46 6 20 20 2z" fill="currentColor"/>
      <path d="M20 9v64M20 32l11 8M20 32L9 40" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <symbol id="pin-a" viewBox="0 0 40 56">
      <path d="M20 2C10 2 2 10 2 20c0 13 18 34 18 34s18-21 18-34c0-10-8-18-18-18z" fill="currentColor"/>
      <circle cx="20" cy="20" r="7.5" fill="#ffffff" opacity=".9"/>
    </symbol>
  </defs>

  <circle cx="110"  cy="240"  r="420" fill="url(#a-menta)"/>
  <circle cx="1300" cy="180"  r="440" fill="url(#a-agua)"/>
  <circle cx="1290" cy="1160" r="420" fill="url(#a-hoja)"/>
  <circle cx="120"  cy="1220" r="400" fill="url(#a-menta)"/>

  <g fill="none" stroke="#30937b" stroke-opacity=".11" stroke-width="2.5">
    <circle cx="700" cy="2340" r="1560"/><circle cx="700" cy="2460" r="1700"/>
  </g>

  <!-- Columna izquierda: reloj, hojas y libreta -->
  <use href="#reloj-g" x="44"  y="92"   width="288" height="288"  color="#30937b" opacity=".20"/>
  <use href="#hoja-a"  x="236" y="404"  width="88"  height="176"  color="#6ea03c" opacity=".17" transform="rotate(28 280 492)"/>
  <use href="#hoja-a"  x="96"  y="470"  width="68"  height="136"  color="#30937b" opacity=".14" transform="rotate(-38 130 538)"/>
  <use href="#libreta" x="62"  y="650"  width="246" height="324"  color="#13779d" opacity=".20" transform="rotate(-7 185 812)"/>
  <use href="#hoja-a"  x="82"  y="1048" width="80"  height="160"  color="#6ea03c" opacity=".16" transform="rotate(-18 122 1128)"/>
  <use href="#hoja-a"  x="232" y="1132" width="62"  height="124"  color="#30937b" opacity=".13" transform="rotate(36 263 1194)"/>

  <!-- Columna derecha: calendario, campana, lápiz y pendientes -->
  <use href="#calendario" x="1122" y="74"   width="234" height="266" color="#13779d" opacity=".20" transform="rotate(6 1239 207)"/>
  <use href="#hoja-a"     x="1084" y="392"  width="78"  height="156" color="#6ea03c" opacity=".16" transform="rotate(-24 1123 470)"/>
  <use href="#campana"    x="1122" y="560"  width="148" height="158" color="#30937b" opacity=".18"/>
  <use href="#lapiz"      x="1276" y="612"  width="64"  height="250" color="#6ea03c" opacity=".20" transform="rotate(32 1308 737)"/>
  <use href="#papel"      x="1108" y="944"  width="252" height="212" color="#13779d" opacity=".18" transform="rotate(-5 1234 1050)"/>
  <use href="#hoja-a"     x="1290" y="1206" width="66"  height="132" color="#30937b" opacity=".13" transform="rotate(34 1323 1272)"/>

  <!-- La ruta al pie, igual que en la sección del horario -->
  <path d="M104 1356C290 1414 480 1428 700 1414s430-56 604-70" fill="none" stroke="#30937b"
        stroke-opacity=".34" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="3 16"/>
  <use href="#pin-a" x="82"   y="1312" width="42" height="58" color="#30937b" opacity=".42"/>
  <use href="#pin-a" x="1272" y="1300" width="42" height="58" color="#13779d" opacity=".42"/>
</svg>
