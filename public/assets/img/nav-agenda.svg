<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-hidden="true">
  <!-- Capa de temporada para el fondo «agenda». Los objetos riman
       con los motivos que ya tiene la sección y van en los márgenes,
       no detrás del texto. Se apaga sola fuera de la temporada. -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1400" height="900" fill="url(#d)"/></mask>
    <g id="campana">
    <path d="M-13 10c0-14 4-22 13-22s13 8 13 22z" fill="none" stroke="#c9a24a" stroke-width="3"/>
    <rect x="-16" y="9" width="32" height="5" rx="2.5" fill="#c9a24a"/>
    <circle cx="0" cy="18" r="4" fill="#b8434f"/>
    <circle cx="0" cy="-15" r="3" fill="#c9a24a"/>
  </g>
    <g id="copo" stroke="#5b86c9" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M0-15V15M-13-7.5 13 7.5M-13 7.5 13-7.5"/>
    <path d="M0-15l-4 4M0-15l4 4M0 15l-4-4M0 15l4-4"/>
  </g>
    <g id="estrella"><path d="M0-14 3.9-3.9 14 0 3.9 3.9 0 14-3.9 3.9-14 0-3.9-3.9z" fill="#c9a24a"/></g>
    <g id="regalo">
    <rect x="-16" y="-6" width="32" height="24" rx="2" fill="#2f7d68"/>
    <rect x="-18" y="-10" width="36" height="8" rx="2" fill="#2f7d68"/>
    <rect x="-3.5" y="-10" width="7" height="28" fill="#c9a24a"/>
    <path d="M-3-10c-8-2-12-8-8-11s8 4 8 11M3-10c8-2 12-8 8-11s-8 4-8 11" fill="#c9a24a"/>
  </g>
  </defs>
  <g mask="url(#m)" opacity=".3">
    <use href="#campana" transform="translate(140 210) scale(1.55)"/>
    <use href="#estrella" transform="translate(1270 180) scale(1.1)"/>
    <use href="#regalo" transform="translate(1240 720) scale(1.3)"/>
    <use href="#campana" transform="translate(260 730) scale(1.15)"/>
    <use href="#copo" transform="translate(640 120) scale(0.9)"/>
    <use href="#estrella" transform="translate(880 810) scale(0.75)"/>
  </g>
</svg>
