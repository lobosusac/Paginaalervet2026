<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-hidden="true">
  <!-- Capa de temporada para el fondo «botanico». Los objetos riman
       con los motivos que ya tiene la sección y van en los márgenes,
       no detrás del texto. Se apaga sola fuera de la temporada. -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1400" height="900" fill="url(#d)"/></mask>
    <g id="copo" stroke="#5b86c9" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M0-15V15M-13-7.5 13 7.5M-13 7.5 13-7.5"/>
    <path d="M0-15l-4 4M0-15l4 4M0 15l-4-4M0 15l4-4"/>
  </g>
    <g id="estrella"><path d="M0-14 3.9-3.9 14 0 3.9 3.9 0 14-3.9 3.9-14 0-3.9-3.9z" fill="#c9a24a"/></g>
    <g id="gorro">
    <path d="M-16 10C-16-6-9-17 0-17S16-6 16 10z" fill="#b8434f"/>
    <path d="M0-17c4-6 10-8 14-6-1 5-5 8-9 9" fill="#b8434f"/>
    <circle cx="15" cy="-24" r="5" fill="#f7f6f2"/>
    <rect x="-19" y="8" width="38" height="8" rx="4" fill="#f7f6f2"/>
  </g>
    <g id="muerdago">
    <path d="M0 0c-5-9-14-12-21-9 2 8 10 13 21 9z" fill="none" stroke="#2f7d68" stroke-width="2.6"/>
    <path d="M0 0c5-9 14-12 21-9-2 8-10 13-21 9z" fill="none" stroke="#2f7d68" stroke-width="2.6"/>
    <circle cx="-4" cy="7" r="3.4" fill="#b8434f"/>
    <circle cx="4" cy="7" r="3.4" fill="#b8434f"/>
    <circle cx="0" cy="13" r="3.4" fill="#b8434f"/>
  </g>
    <g id="regalo">
    <rect x="-16" y="-6" width="32" height="24" rx="2" fill="#2f7d68"/>
    <rect x="-18" y="-10" width="36" height="8" rx="2" fill="#2f7d68"/>
    <rect x="-3.5" y="-10" width="7" height="28" fill="#c9a24a"/>
    <path d="M-3-10c-8-2-12-8-8-11s8 4 8 11M3-10c8-2 12-8 8-11s-8 4-8 11" fill="#c9a24a"/>
  </g>
  </defs>
  <g mask="url(#m)" opacity=".3">
    <use href="#muerdago" transform="translate(150 190) scale(1.5)"/>
    <use href="#muerdago" transform="translate(1250 710) scale(1.3)"/>
    <use href="#gorro" transform="translate(1270 240) scale(1.2)"/>
    <use href="#estrella" transform="translate(300 780) scale(0.8)"/>
    <use href="#copo" transform="translate(1120 140) scale(1.0)"/>
    <use href="#regalo" transform="translate(210 690) scale(1.0)"/>
