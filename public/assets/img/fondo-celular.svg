<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 720" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Segundo fondo decorativo de Alervet, para la sección de inmunoterapia.
       Arcos amplios, partículas de alérgeno arriba a la derecha y un cúmulo
       de burbujas abajo, en los verdes de la marca. Opacidades bajas a
       propósito: el texto que va encima conserva su contraste. -->
  <defs>
    <radialGradient id="bola-verde" cx="35%" cy="30%">
      <stop offset="0"  stop-color="#bfe3d6" stop-opacity=".95"/>
      <stop offset="65" stop-color="#7cc0aa" stop-opacity=".75"/>
      <stop offset="1"  stop-color="#30937b" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="bola-agua" cx="34%" cy="28%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#9fd2e2" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="halo-verde">
      <stop offset="0" stop-color="#30937b" stop-opacity=".30"/>
      <stop offset="1" stop-color="#30937b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-oliva">
      <stop offset="0" stop-color="#6ea03c" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6ea03c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-agua">
      <stop offset="0" stop-color="#13779d" stop-opacity=".26"/>
      <stop offset="1" stop-color="#13779d" stop-opacity="0"/>
    </radialGradient>

    <!-- Partícula de alérgeno con volumen -->
    <symbol id="particula" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="34" fill="url(#bola-verde)"/>
      <g fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" opacity=".85">
        <path d="M93 60h7M88.6 76.5l6 3.5M76.5 88.6l3.5 6M60 93v7M43.5 88.6l-3.5 6M31.4 76.5l-6 3.5M27 60h-7M31.4 43.5l-6-3.5M43.5 31.4l-3.5-6M60 27v-7M76.5 31.4l3.5-6M88.6 43.5l6-3.5"/>
      </g>
      <g fill="currentColor" opacity=".85">
        <circle cx="105" cy="60" r="5"/><circle cx="99" cy="82.5" r="5"/><circle cx="82.5" cy="99" r="5"/>
        <circle cx="60" cy="105" r="5"/><circle cx="37.5" cy="99" r="5"/><circle cx="21" cy="82.5" r="5"/>
        <circle cx="15" cy="60" r="5"/><circle cx="21" cy="37.5" r="5"/><circle cx="37.5" cy="21" r="5"/>
        <circle cx="60" cy="15" r="5"/><circle cx="82.5" cy="21" r="5"/><circle cx="99" cy="37.5" r="5"/>
      </g>
    </symbol>

    <symbol id="burbuja" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="url(#bola-agua)"/>
      <circle cx="50" cy="50" r="46" fill="none" stroke="#13779d" stroke-width="1.8" opacity=".35"/>
      <circle cx="35" cy="33" r="11" fill="#ffffff" opacity=".5"/>
    </symbol>
  </defs>

  <!-- Halos de color -->
  <circle cx="1300" cy="60"  r="420" fill="url(#halo-oliva)"/>
  <circle cx="1240" cy="700" r="400" fill="url(#halo-agua)"/>
  <circle cx="120"  cy="120" r="360" fill="url(#halo-verde)"/>
  <circle cx="40"   cy="660" r="300" fill="url(#halo-agua)"/>

  <!-- Arcos amplios que cruzan la sección -->
  <g fill="none" stroke="#30937b" stroke-opacity=".16" stroke-width="2.5">
    <circle cx="180" cy="900" r="820"/>
    <circle cx="150" cy="940" r="900"/>
    <circle cx="1320" cy="-180" r="560"/>
  </g>
  <g fill="none" stroke="#13779d" stroke-opacity=".13" stroke-width="2">
    <circle cx="1180" cy="1080" r="700"/>
    <circle cx="-120" cy="300" r="430"/>
  </g>

  <!-- Partículas de alérgeno, arriba a la derecha -->
  <use href="#particula" x="1244" y="-16" width="150" height="150" color="#4aa88d" opacity=".55"/>
  <use href="#particula" x="1148" y="112" width="102" height="102" color="#6ea03c" opacity=".45"/>
  <use href="#particula" x="1326" y="150" width="122" height="122" color="#30937b" opacity=".40"/>
  <use href="#particula" x="1036" y="22"  width="70"  height="70"  color="#4aa88d" opacity=".38"/>
  <use href="#particula" x="1252" y="248" width="62"  height="62"  color="#6ea03c" opacity=".30"/>

  <!-- Cúmulo de burbujas, abajo a la derecha -->
  <g opacity=".62">
    <use href="#burbuja" x="1188" y="520" width="150" height="150"/>
    <use href="#burbuja" x="1306" y="590" width="118" height="118"/>
    <use href="#burbuja" x="1104" y="628" width="104" height="104"/>
    <use href="#burbuja" x="1268" y="470" width="80"  height="80"/>
    <use href="#burbuja" x="1348" y="500" width="64"  height="64"/>
    <use href="#burbuja" x="1010" y="672" width="76"  height="76"/>
    <use href="#burbuja" x="1206" y="676" width="58"  height="58"/>
  </g>
  <g opacity=".42">
    <use href="#burbuja" x="24"  y="596" width="96" height="96"/>
    <use href="#burbuja" x="126" y="664" width="66" height="66"/>
  </g>

  <!-- Motas sueltas -->
  <g fill="#30937b" opacity=".22">
    <circle cx="1000" cy="250" r="5"/>
    <circle cx="1120" cy="330" r="7"/>
    <circle cx="1390" cy="360" r="6"/>
  </g>
</svg>
