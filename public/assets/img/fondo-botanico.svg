<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" preserveAspectRatio="xMidYMid slice" role="presentation">
  <!-- Tercer fondo decorativo de Alervet, para "Quién te atiende".
       Follaje suave, arcos amplios, un cúmulo de polen cálido arriba a la
       derecha y línea de huella + estetoscopio abajo a la izquierda. -->
  <defs>
    <radialGradient id="halo-menta">
      <stop offset="0" stop-color="#30937b" stop-opacity=".26"/>
      <stop offset="1" stop-color="#30937b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-hoja">
      <stop offset="0" stop-color="#6ea03c" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6ea03c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo-polen">
      <stop offset="0" stop-color="#c2a45f" stop-opacity=".28"/>
      <stop offset="1" stop-color="#c2a45f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grano" cx="36%" cy="30%">
      <stop offset="0" stop-color="#f0e4c4" stop-opacity=".95"/>
      <stop offset="1" stop-color="#c2a45f" stop-opacity=".70"/>
    </radialGradient>

    <symbol id="hoja" viewBox="0 0 40 80">
      <path d="M20 2C34 20 38 46 38 58c0 14-8 20-18 20S2 72 2 58C2 46 6 20 20 2z" fill="currentColor"/>
      <path d="M20 9v64M20 30l11 8M20 30L9 38M20 48l12 8M20 48L8 56" fill="none"
            stroke="#ffffff" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
    </symbol>

    <!-- Rama: un tallo con seis hojas -->
    <symbol id="rama" viewBox="0 0 220 300">
      <path d="M110 296C110 224 100 140 58 56" fill="none" stroke="currentColor"
            stroke-width="3.4" stroke-linecap="round" opacity=".75"/>
      <g opacity=".85">
        <use href="#hoja" transform="translate(112 214) rotate(56) scale(.78)"  width="40" height="80"/>
        <use href="#hoja" transform="translate(96 206) rotate(-128) scale(.72)" width="40" height="80"/>
        <use href="#hoja" transform="translate(96 150) rotate(48) scale(.86)"   width="40" height="80"/>
        <use href="#hoja" transform="translate(78 142) rotate(-134) scale(.78)" width="40" height="80"/>
        <use href="#hoja" transform="translate(76 88)  rotate(40) scale(.92)"   width="40" height="80"/>
        <use href="#hoja" transform="translate(58 78)  rotate(-142) scale(.84)" width="40" height="80"/>
      </g>
    </symbol>

    <!-- Grano de polen: el alérgeno, en tono cálido -->
    <symbol id="polen-calido" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="26" fill="url(#grano)"/>
      <g fill="#c2a45f" opacity=".8">
        <circle cx="84" cy="50" r="4.6"/><circle cx="79" cy="67" r="4.6"/><circle cx="67" cy="79" r="4.6"/>
        <circle cx="50" cy="84" r="4.6"/><circle cx="33" cy="79" r="4.6"/><circle cx="21" cy="67" r="4.6"/>
        <circle cx="16" cy="50" r="4.6"/><circle cx="21" cy="33" r="4.6"/><circle cx="33" cy="21" r="4.6"/>
        <circle cx="50" cy="16" r="4.6"/><circle cx="67" cy="21" r="4.6"/><circle cx="79" cy="33" r="4.6"/>
      </g>
      <g fill="none" stroke="#c2a45f" stroke-width="2.6" stroke-linecap="round" opacity=".7">
        <path d="M76 50h4M72 62l3.5 2M62 72l2 3.5M50 76v4M38 72l-2 3.5M28 62l-3.5 2M24 50h-4M28 38l-3.5-2M38 28l-2-3.5M50 24v-4M62 28l2-3.5M72 38l3.5-2"/>
      </g>
    </symbol>

    <!-- Huella y estetoscopio, en línea -->
    <symbol id="huella-linea" viewBox="0 0 110 110">
      <g fill="none" stroke="currentColor" stroke-width="3.2">
        <ellipse cx="24" cy="44" rx="10" ry="14" transform="rotate(-22 24 44)"/>
        <ellipse cx="45" cy="29" rx="10" ry="15" transform="rotate(-8 45 29)"/>
        <ellipse cx="68" cy="30" rx="10" ry="15" transform="rotate(10 68 30)"/>
        <ellipse cx="88" cy="47" rx="10" ry="14" transform="rotate(25 88 47)"/>
        <path d="M56 52c17 0 30 12 30 25 0 12-10 19-21 19-4 0-6-1.5-9-1.5s-5 1.5-9 1.5c-11 0-21-7-21-19 0-13 13-25 30-25z"/>
      </g>
    </symbol>

    <symbol id="esteto-linea" viewBox="0 0 120 120">
      <g fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round">
        <path d="M24 14v30c0 16 12 25 25 25s25-9 25-25V14"/>
        <path d="M49 69v12c0 12 9 21 21 21s21-9 21-21v-9"/>
        <circle cx="91" cy="62" r="10"/>
        <circle cx="24" cy="12" r="5"/><circle cx="74" cy="12" r="5"/>
      </g>
    </symbol>
  </defs>

  <!-- Halos -->
  <circle cx="60"   cy="180" r="380" fill="url(#halo-menta)"/>
  <circle cx="1310" cy="90"  r="400" fill="url(#halo-polen)"/>
  <circle cx="1360" cy="720" r="380" fill="url(#halo-hoja)"/>
  <circle cx="120"  cy="780" r="330" fill="url(#halo-menta)"/>

  <!-- Arcos -->
  <g fill="none" stroke="#30937b" stroke-opacity=".15" stroke-width="2.5">
    <circle cx="240" cy="-380" r="720"/>
    <circle cx="200" cy="-430" r="800"/>
  </g>
  <g fill="none" stroke="#6ea03c" stroke-opacity=".12" stroke-width="2">
    <circle cx="1150" cy="1160" r="660"/>
  </g>

  <!-- Follaje -->
  <use href="#rama" x="-44"  y="470" width="250" height="340" color="#6ea03c" opacity=".26" transform="rotate(-16 81 640)"/>
  <use href="#rama" x="88"   y="588" width="190" height="260" color="#30937b" opacity=".20" transform="rotate(14 183 718)"/>
  <use href="#rama" x="1248" y="446" width="230" height="314" color="#6ea03c" opacity=".26" transform="rotate(18 1363 603)"/>
  <use href="#rama" x="1126" y="602" width="180" height="246" color="#30937b" opacity=".18" transform="rotate(-12 1216 725)"/>
  <use href="#rama" x="-30"  y="-96" width="200" height="272" color="#30937b" opacity=".16" transform="rotate(168 70 40)"/>

  <!-- Polen, arriba a la derecha -->
  <use href="#polen-calido" x="1284" y="-4"  width="118" height="118" opacity=".72"/>
  <use href="#polen-calido" x="1192" y="86"  width="82"  height="82"  opacity=".60"/>
  <use href="#polen-calido" x="1330" y="122" width="96"  height="96"  opacity=".55"/>
  <use href="#polen-calido" x="1120" y="16"  width="56"  height="56"  opacity=".48"/>
  <use href="#polen-calido" x="1258" y="182" width="50"  height="50"  opacity=".42"/>

  <!-- Línea: huella y estetoscopio, abajo a la izquierda -->
  <use href="#huella-linea" x="46"  y="666" width="112" height="112" color="#30937b" opacity=".26" transform="rotate(-10 102 722)"/>
  <use href="#esteto-linea" x="164" y="640" width="132" height="132" color="#13779d" opacity=".20"/>
</svg>
