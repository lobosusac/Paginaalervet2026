<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" role="img" aria-hidden="true">
  <!-- Capa de temporada para el fondo «acupuntura». Los objetos riman
       con los motivos que ya tiene la sección y van en los márgenes,
       no detrás del texto. Se apaga sola fuera de la temporada. -->
  <defs>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".2" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".8" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1400" height="900" fill="url(#d)"/></mask>
    <g id="baston">
    <path d="M-6 22V0a10 10 0 0120 0" fill="none" stroke="#b8434f"
          stroke-width="7" stroke-linecap="round"/>
    <path d="M-6 22V0a10 10 0 0120 0" fill="none" stroke="#f7f6f2"
          stroke-width="7" stroke-linecap="round"
          stroke-dasharray="5 10"/>
  </g>
    <g id="copo" stroke="#5b86c9" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M0-15V15M-13-7.5 13 7.5M-13 7.5 13-7.5"/>
    <path d="M0-15l-4 4M0-15l4 4M0 15l-4-4M0 15l4-4"/>
  </g>
    <g id="estrella"><path d="M0-14 3.9-3.9 14 0 3.9 3.9 0 14-3.9 3.9-14 0-3.9-3.9z" fill="#c9a24a"/></g>
    <g id="vela">
    <rect x="-7" y="-2" width="14" height="26" rx="2" fill="none" stroke="#2f7d68" stroke-width="2.8"/>
    <path d="M0-4c0-7 5-8 5-13 3 4 4 7 4 10 0 4-4 7-9 7z" fill="#c9a24a"/>
    <path d="M0-2v-6" stroke="#2f7d68" stroke-width="2"/>
  </g>
  </defs>
  <g mask="url(#m)" opacity=".3">
    <use href="#baston" transform="translate(140 200) scale(1.6)"/>
    <use href="#baston" transform="translate(1260 270) scale(1.3)"/>
    <use href="#vela" transform="translate(250 710) scale(1.4)"/>
    <use href="#estrella" transform="translate(1140 160) scale(0.9)"/>
    <use href="#vela" transform="translate(1190 730) scale(1.2)"/>
    <use href="#copo" transform="translate(560 120) scale(0.9)"/>
  </g>
</svg>
